<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Responses — Remon &amp; Merna</title>
  <meta name="description" content="RSVP responses for Remon and Merna's wedding." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="responses-body">
  <main class="responses-page" id="responses-page">
    <section class="responses-hero">
      <div class="container">
        <a class="responses-back" href="index.html">Back to invitation</a>
        <p class="eyebrow">Remon &amp; Merna</p>
        <h1 class="display-h2">RSVP Responses</h1>
        <p class="responses-subtitle">Live guest replies from Supabase.</p>
      </div>
    </section>

    <section class="responses-content">
      <div class="container">
        <div class="responses-actions">
          <div class="responses-stats" aria-label="RSVP summary">
            <article class="responses-stat">
              <span id="stat-total">0</span>
              <p>Total</p>
            </article>
            <article class="responses-stat">
              <span id="stat-attending">0</span>
              <p>Attending</p>
            </article>
            <article class="responses-stat">
              <span id="stat-declined">0</span>
              <p>Declined</p>
            </article>
            <article class="responses-stat">
              <span id="stat-guests">0</span>
              <p>Guests</p>
            </article>
          </div>
          <div class="responses-buttons">
            <button type="button" class="btn btn--ghost btn--compact" id="refresh-responses">Refresh</button>
            <button type="button" class="btn btn--primary btn--compact" id="export-responses">Export CSV</button>
          </div>
        </div>

        <p class="form-message" id="responses-message" hidden></p>
        <p class="responses-empty" id="responses-empty" hidden>No responses yet.</p>

        <div class="responses-table-wrap">
          <table class="responses-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Attend</th>
                <th>Guests</th>
                <th>Note</th>
                <th>Received</th>
              </tr>
            </thead>
            <tbody id="responses-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/rsvp-supabase.js"></script>
</body>
</html>
